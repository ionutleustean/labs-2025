<div class="bg-gray-100">
<div class="container py-5 ">
  <h3> Add pizza </h3>

  <div class="row">
    <div class="col-12 col-md-6">
      <form
        #pizzaForm="ngForm"
        (ngSubmit)="onSubmit(pizzaForm)"
        class="mb-xl-5 pb-xl-5"
        >
<!--// imageUrl: '',-->
<!--        ingredients: []-->


        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input name="name" type="text" class="form-control" id="name" [ngModel]="pizza().name" (ngModelChange)="nameChanged($event)" >
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea name="description" class="form-control" id="description" rows="3" [ngModel]="pizza().description" (ngModelChange)="descriptionChanged($event)"></textarea>
        </div>

        <div class="mb-3">
          <label for="price" class="form-label">Price</label>
          <input name="price" type="number" class="form-control" id="price" [ngModel]="pizza().price" (ngModelChange)="priceChanged($event)" >
        </div>

        <div class="mb-3">
          <label for="ingredients" class="form-label">Ingredients</label>
          <input name="ingredients" type="text" class="form-control" id="ingredients" [ngModel]="ingredients" (ngModelChange)="ingredientsChanged($event)" >
        </div>

        <div class="mb-3">
          <label for="image" class="form-label">Image</label>
          <input type="file" class="form-control" id="image" (change)="onFileSelected($event)" accept="image/*" />
        </div>

        @if(pizza().imageUrl){
        <img  [src]="pizza().imageUrl" alt="Preview" style="max-width: 300px;" />
        }

        <div class="d-flex justify-content-md-end mt-3 ">
          <button type="submit" class="btn btn-primary"> Submit </button>
        </div>

      </form>

    </div>
    <div class="col-12 col-md-6">
    </div>

  </div>
</div>
</div>
