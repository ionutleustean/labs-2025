<div id="header" [style.height]="'100vh'">
  <nav class="navbar navbar-expand-lg sticky-top bg-body-tertiary">
    <div class="container-fluid space-between">
      <a class="navbar-brand" href="#">My Pizza</a>
      <div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#header">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#pizzas">Pizzas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#add-pizza">Add pizza</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#footer">Footer</a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </nav>
  @if (index === 0) {
    <div class="slide" [ngStyle]="{'background-image': 'url(/'+ header1.imageUrl + ')'}">
      <div class="container">
        <div class="row">
          <div class="col-12 col-md-6">
            <h1> {{ header1.title }} </h1>
            <p> {{ header1.description }} </p>
          </div>
        </div>
      </div>
    </div>
  }
  @if (index === 1) {
    <div class="slide" [ngStyle]="{'background-image': 'url(/'+ header2.imageUrl + ')'}">
      <div class="container">
        <div class="row">
          <div class="col-12 col-md-6">
            <h1> {{ header2.title }} </h1>
            <p> {{ header2.description }} </p>
          </div>
        </div>
      </div>
    </div>
  }
  @if (index === 2) {
    <div class="slide" [ngStyle]="{'background-image': 'url(/'+ header3.imageUrl + ')'}">
      <div class="container">
        <div class="row">
          <div class="col-12 col-md-6">
            <h1> {{ header3.title }} </h1>
            <p> {{ header3.description }} </p>
          </div>
        </div>
      </div>
    </div>
  }
  <div class="control d-flex justify-content-center">
    <button type="button" class="btn" (click)="setIndex(0)">
      @if (index === 0) {
        ●
      } @else {
        ○
      }
    </button>
    <button type="button" class="btn" (click)="setIndex(1)">
      @if (index === 1) {
        ●
      } @else {
        ○
      }
    </button>
    <button type="button" class="btn" (click)="setIndex(2)">
      @if (index === 2) {
        ●
      } @else {
        ○
      }
    </button>
  </div>
</div>
