# Form in angular

## Form in angular


.small[
.left-column[
```html
<form #personForm="ngForm"
    (ngSubmit)="onSubmit(personForm)">

  <input name="firstName"
    [ngModel]="person.firstName"
    (ngModelChange)="firstNameChanged($event)"/>

  <input name="lastName"
    [ngModel]="person.lastName"
    (ngModelChange)="lastNameChanged($event)"/>

  <input name="age"
    [ngModel]="person.age"
    (ngModelChange)="ageChanged($event)"/>

  <button type="submit">Submit</button>

</form>


```

.clear[.important[
    ####Usually we use this.person() to save the whole object
]   ]
]

.right-column[
```ts
@Component({
  selector: 'app-person-form',
  templateUrl: './person-form.component.html'
})
export class PersonFormComponent {
   person = signal<Person>(new Person());

    firstNameChanged(firstName: string) {
        this.person.update((prev) => {
            return {...prev, firstName: firstName};
        });
    }

    lastNameChanged(lastName: string) {
        ...
    }

    ageChanged(age: number) {
        ...
    }

    onSubmit(form: NgForm) {
        console.log(form.value);
        // save date to the  server
        // you can use form.value if only values are needed
        // or you can use this.person() if you need the whole object

    }

}

```

## Smart components vs Presentational (Dumb)  components
**Smart components** are responsible for the business logic of the application. They are responsible for fetching data, handling events, and managing state.

**Presentational (Dumb) components** are responsible for rendering the UI. They receive data from smart components and display it to the user.
---
## Smart/Presentational components - data flow


                                ┌────────────────────────────┐
                                │      Smart Component       │
                                │  (Container / Logic Layer) │
                                └────────────────────────────┘
                                          ▲       ▲
       output() events from               │       │               Data via input()
       child components                   │       │               emitted to children
                                          │       │
           ┌────────────────────────┐     │       │      ┌────────────────────────┐
           │ Presentational Child A │◄────┘       └─────►│ Presentational Child B │
           │  (e.g. List Component) │                  │ │ (e.g. Detail / Editor) │
           └────────────────────────┘                  │ └────────────────────────┘
                  │                                    │
     User clicks, selects, etc.                        │
                  └─────► Event emitted to Smart ◄─────┘
                          (e.g. "itemSelected", "editRequested")

##Validators

#### Build in validators


| `Validators` Method         | Description                          | Template-Driven Directive / Usage                   |
|----------------------------|--------------------------------------|-----------------------------------------------------|
| `Validators.required`      | Field must be filled                 | `<input required>`                                  |
| `Validators.requiredTrue`  | Checkbox must be checked             | `<input type="checkbox" required>`                  |
| `Validators.email`         | Must be a valid email format         | `<input type="email">`                              |
| `Validators.minLength(x)`  | Minimum number of characters         | `<input minlength="5">`                             |
| `Validators.maxLength(x)`  | Maximum number of characters         | `<input maxlength="45">`                            |
| `Validators.pattern(x)`    | Must match regex pattern             | `<input pattern="[a-zA-Z ]+">`                      |
| `Validators.min(x)`        | Minimum numeric value                | `<input type="number" min="1">`                     |
| `Validators.max(x)`        | Maximum numeric value                | `<input type="number" max="10">`                    |

### What should happen now?

    1) The form submission is blocked.
    2) A validation error message will be displayed.
    3) The problematic field will be visually highlighted.

---
### 1) The form submission is blocked.

```html
<form #personForm="ngForm" (ngSubmit)="onSubmit(personForm)">
....
</form>

```

```typescript

export class PersonForm {
    ...
    ngSubmit(form: NgForm) {
        if (form.valid) {
            // submit the form
        }
    }
    ...
}
```
---
###  2) A validation error message will be displayed.



```html
   <form #personForm="ngForm" (ngSubmit)="onSubmit(personForm)">

        <input name="firstName" #nameControl="ngModel" [ngModel]="person.firstName" required  minlength="5" maxlength="45" />

        @if (personForm.submitted && nameControl.errors) {
              <div>
                {{ nameControl.errors['required'] ? 'Name is required' : '' }}
                {{ nameControl.errors['minlength'] ? 'Name is too short' : '' }}
                {{ nameControl.errors['maxlength'] ? 'Name is too long' : '' }}
              </div>
            }
    </form>

```

---

### 3) The problematic field will be visually highlighted.

Angular automatically mirrors many control properties onto the form control element as CSS classes. Use these classes to style form control elements according to the state of the form. The following classes are currently supported.

    .ng-valid
    .ng-invalid
    .ng-pending
    .ng-pristine
    .ng-dirty
    .ng-untouched
    .ng-touched
    .ng-submitted (enclosing form element only)



### .red[*] in global style we could add:
```css
.ng-invalid  {
    border: 1px solid red;
}
```
