# Angular Forms
## Custom Validators & ControlValueAccessor

---
# What Is a Form-Field Validator?

- **Form Value**
    
    - The combined values of all its fields
        
- **Form Validity State** (we used this in onSubmit, the `form.valid` property, remember?)
    
    - `true` if **every** field is valid
        
    - `false` as soon as **any** field is invalid
        

Each **form field** carries its own set of business rules (e.g. “required,” “min length of 10,” etc.) which are enforced by validators.

---
## Field-Level Validators: Definition

A **Validator** is simply a function that:

1. Takes a `FormControl` (i.e. a single field)
    
2. Checks its value against one or more rules
    
3. Returns
    
    - `null` if the field is **valid**
        
    - An **error map** (e.g. `{ required: true }`) if the field is **invalid**

---

## How Validators Are Applied

- **Template-Driven Forms**
    
    ```html
    <input
      name="username"
      ngModel
      required
      minlength="10"
      #username="ngModel">
    ```
    
- **Reactive Forms**
    
    ```ts
    new FormControl(
      '',
      [ Validators.required, Validators.minLength(10) ]
    );
    ```
    

Here, Angular wires up each validator function behind the scenes, updating the field’s validity state and propagating it to the parent form.

---

# Custom Validators in Template-Driven Forms

- All validation rules live in the **template** via directives

- Unlike Reactive Forms, you must supply both:

    1. A **validator function**

    2. A **directive** that registers it with Angular’s DI

---

## Simple Password-Strength Validator

```ts
import { AbstractControl, ValidationErrors } from '@angular/forms';

export function createPasswordStrengthValidator() {
  return (control: AbstractControl): ValidationErrors | null => {
    const errors: ValidationErrors = {};

    const value = control.value || '';
    const hasUpper = /[A-Z]/.test(value);
    if (!hasUpper) { errors['hasUpper'] = true; }

    const hasLower = /[a-z]/.test(value);
    if (!hasLower) { errors['hasLower'] = true; }

    const hasNumber = /\d/.test(value);
    if (!hasNumber) { errors['hasNumber'] = true; }

    const isLongEnough = value.length >= 8;
    if (!isLongEnough) { errors['isLongEnough'] = true;}

    // Return null if no errors, otherwise return the errors object
    return Object.keys(errors).length ? errors : null;
  };
}
```

---

The validator checks that the password complies with:

- ≥ 8 characters
- At least one uppercase letter
- At least one lowercase letter
- At least one number
- Is long enough

We return:
- `null` if the password is valid
- or an object with the errors:

```ts
{
  hasUpper: true,
  hasLower: true,
  hasNumber: true,
  isLongEnough: true
}
```

## What Is a Directive?

- A class that adds behavior or transforms elements in your template

- Declared with a **selector**

- Built-in examples: `*ngIf`, `minLength`, `ngModel`

- Custom directives let you extend HTML with your own functionality

---

## Custom Validator Directive: Skeleton

```ts
import { Directive } from '@angular/core';
import {
  AbstractControl,
  NG_VALIDATORS,
  ValidationErrors,
  Validator
} from '@angular/forms';
import { createPasswordStrengthValidator } from '../validators/password-strength.validator';

@Directive({
  selector: '[passwordStrength]',
  providers: [{
    provide: NG_VALIDATORS,
    useExisting: PasswordStrengthDirective,
    multi: true
  }]
})
export class PasswordStrengthDirective implements Validator {
  validate(control: AbstractControl): ValidationErrors | null {
    // Delegate to our pure validator factory
    return createPasswordStrengthValidator()(control);
  }
}
```

---

## Directive Breakdown

- **Selector**: `"[passwordStrength]"` → in the template we will not use the `[]` brackets
    
- **Providers**:
    
    - Registers under `NG_VALIDATORS`
        
    - `multi: true` → allows stacking with other validators

    - `useExisting: PasswordStrengthDirective` → tells Angular to reuse the directive instance itself as the validator provider
        
- **Implements**: `Validator` interface
    
    - Method: `validate(control: AbstractControl): ValidationErrors | null`
        
- **Delegation**: Calls the `createPasswordStrengthValidator()`

---

## Using a Custom Validator Directive in our form:

```html
<form #registerForm="ngForm" (ngSubmit)="register(registerForm, $event)">
  <input
        ....
         placeholder="Email">

  <input type="password"
         name="password"
         ngModel
         #passwordControl="ngModel"
         required
         passwordStrength
         minlength="8"
         placeholder="Password">
  @if (registerForm.submitted && passwordControl.errors) {
    <div class="text-red">
      {{ passwordControl.errors['hasLower'] ? 'Must contain at least one lowercase character.' : '' }}
      {{ passwordControl.errors['hasUpper'] ? 'Must contain at least one uppercase character.' : '' }}
      {{ passwordControl.errors['isLongEnough'] ? 'Password must be at least 8 characters.' : '' }}
      {{ passwordControl.errors['hasNumber'] ? 'Password must contain at least one number.' : '' }}
    </div>
    }
```
- Built-in directives: `required`, `email`, `minlength`, `maxlength`
- **Custom** directive: `passwordStrength`

## What is ControlValueAccessor (CVA)?
A **CVA** is a bridge between Angular Forms API and a custom UI component.

- Syncs the model ↔ view via methods in the ControlValueAccessor interface

    - Receive form model updates

    - Notify the form when its value changes

    - Reflect touched/disabled states

---

## Why Use a CVA?

- Treat custom components like standard form controls in template-driven forms
    
- Automatic binding for `ngModel`, validation, and change handling
    
- Reduces boilerplate: Angular manages value propagation and change detection
   

**Examples:** 
- **Price Range Slider**: Creates a dual-handle slider for min/max price selection
- **Phone Input**: Combines country code dropdown with phone input field
- **Rating Component**: Visual star/number rating that maps to numeric value

---

## CVA Interface Methods

.large[

| Method                   | Does                                    |
|--------------------------|-----------------------------------------|
| writeValue(value: any)   | Sets UI state when form model changes   |
| registerOnChange(fn)     | Store callback; call on value change    |
| registerOnTouched(fn)    | Store callback; call on touch events    |
| setDisabledState(isOff)  | Enable/disable UI                       |
]

**Flow of data**:

```
FormControl <--> NgControl <--> ControlValueAccessor <--> CustomComponent
```

## CVA Example: Star Rating Component

```ts
@Component({
  selector: 'star-rating',
  templateUrl: './star-rating.component.html',
  providers: [{
    provide: NG_VALUE_ACCESSOR,
    useExisting: forwardRef(() => StarRatingComponent),
    multi: true
  }]
})
export class StarRatingComponent implements ControlValueAccessor {
  stars = Array(5).fill(0);
  rating = signal(0);
  private onChange = (value: number) => {}; // initialize as empty callback
  private onTouched = () => {}; // // initialize as empty callback

  writeValue(value: number): void { this.rating.set(value); }
  registerOnChange(fn: any): void { this.onChange = fn; } // set callback
  registerOnTouched(fn: any): void { this.onTouched = fn; } // set callback
  setDisabledState?(isDisabled: boolean): void { // handle disabled state}

  onClick(value: number): void {
    this.rating.set(value);
    this.onChange(value);
    this.onTouched();
  }
}
```
---

## Using Star Rating in Template-Driven Forms

```html
<form #feedbackForm="ngForm" (ngSubmit)="submit(feedbackForm)">
  <label>Rate our service:</label>
  <star-rating
    name="serviceRating"
    [ngModel]="values().rating"
    (ngModelChange)="ratingChanged($event)"
    >
  </star-rating>

  <button type="submit" [disabled]="!feedbackForm.valid">
    Submit
  </button>
</form>
```

- Uses **signals** inside the component for state
    
- Two-way binding via calling the stored `onChange` callback
