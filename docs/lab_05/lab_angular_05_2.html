## In Angular we have

.left-column[
###Observables
1. Asynchronous
2. May not have a value yet or at all
3. Push based (always reactive)
4. Huge set of operators (map, merge, switchMap, etc.)
5. Complex async flows (HTTP, WebSockets, etc.)

]

.right-column[
###Signals
1. Synchronous
2. Always have a value
3. Pull based by default
4. Push based in reactive context
5. Simple UI reactivity, local component state
]

# Signals

1. **Synchronous**
        Data is available immediately (no need to wait)
2. **Always have a value**
        Get the value at the time of the call
3. **Pull based by default**
        Get the value "only" when called
4. **Push based in reactive context**

    If the value changes over time, it will notify the caller automatically — as long as we're within
    `Angular's reactive context`.
.red[
    Reactive context: ` template `, ` computed `, ` effect `
]

---

###Template

```html
<div>{{ counter() }}</div>
```
Angular tracks `counter()`, and re-renders the `<div>` automatically when the signal changes.


---
### computed


The `computed()` function in Angular allows you to **derive a value based on one or more signals**. It automatically re-evaluates when any of its dependencies change, and it caches the result until then.

```ts
const firstName = signal('John');
const lastName = signal('Doe');

const fullName = computed(() => `${firstName()} ${lastName()}`);

console.log(fullName()); // "John Doe"
```

- `computed()` only recalculates when one of the signals it uses (`firstName`, `lastName`) changes.
- It is **lazy**: it runs only when needed.
- It’s similar to a **getter** that automatically tracks dependencies.

This is ideal for **derived state**, where the value is based on other signals but should always be consistent and memoized.

---

```typescript
import { signal, computed } from '@angular/core';

const user = signal({ id: 1, name: 'Alice', age: 30, hobbies: ['reading', 'gaming'] });
const role = signal('admin');

const userInfo = computed(() => {
  const { id, name } = user();
  return { id, name };
});

const userProfile = computed(() => ({
  ...userInfo(),
  role: role()
}));

console.log(userProfile());
// Output: { id: 1, name: 'Alice', role: 'admin' }
```

.important[

    Always use `computed` when you need to derive a value based on other signals.

    Provide child components with just the information relevant to them.

]

### effect

The `effect()` function sets up **reactive side effects** — code that should run automatically when signals it depends on change.

```ts
constructor() {
    effect(() => {
      console.log(`Full name is: ${fullName()}`);
    });
}

firstName.set('Jane');
// Console: "Full name is: Jane Doe"
```

- `effect()` tracks any signals accessed inside it and re-runs when any of them change.
- It’s ideal for **running imperative logic** such logging, syncing with external systems, external lybraries etc.
- Use `effect()` when you want something to **react to signal changes but don’t return a value**.

Think of it like a **watcher** or **reaction handler**.

## Interop Between Signals and Observables


.small[
.left-column[
### 🔁 `toSignal()`: Observable ➞ Signal

Use when you want to **consume an Observable as a Signal** in a reactive component.

```ts
 user$ = http.get<User>('/api/user');
 userSignal = toSignal(user$);
```

✅ Automatically subscribes
✅ Updates Signal value on new emissions
⚠️ Optionally provide an initial value if the Observable is async

```ts
 userSignal = toSignal(user$, { initialValue: null });
```

]
.right-column[

### 🔁 `toObservable()`: Signal ➞ Observable

Use when you need to **expose a Signal to code expecting an Observable**,
like services or RxJS operators.

```ts
 count = signal(0);
 count$ = toObservable(count);
```

✅ Emits new values when Signal changes
✅ Fully compatible with RxJS pipelines

```ts
count$.pipe(
  debounceTime(300),
  tap(value => console.log(value))
).subscribe();
```
